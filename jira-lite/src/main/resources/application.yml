server:
  port: 8080

spring:
  application:
    name: jira-lite

  # -- PostgreSQL --------------------------------------------------
  datasource:
    url: jdbc:postgresql://localhost:5432/jiralite
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 30000

  # -- Flyway Database Migrations ----------------------------------
  flyway:
    enabled: true
    locations: classpath:db/migration
    # baseline-on-migrate stamps an existing schema (created by Hibernate) as
    # version 0 on the very first Flyway run, then tracks future migrations
    # normally. Safe for databases that pre-date Flyway adoption.
    baseline-on-migrate: true
    baseline-version: 0

  # -- JPA / Hibernate ---------------------------------------------
  jpa:
    hibernate:
      # Flyway now owns the schema; Hibernate only validates entities match it.
      ddl-auto: validate
    show-sql: false
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: UTC

  # -- Redis -------------------------------------------------------
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
      connect-timeout: 2000ms

  # -- Cache -------------------------------------------------------
  cache:
    type: redis
    redis:
      time-to-live: 600000
      cache-null-values: false

  # -- Mail (configure for production) ----------------------------
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

# -- JWT Configuration -------------------------------------------
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: 86400000   # 24 hours

# -- Swagger / OpenAPI -------------------------------------------
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# -- Logging -----------------------------------------------------
logging:
  level:
    root: INFO
    com.jiralite: DEBUG
    org.springframework.security: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] [traceId=%X{correlationId}] %-5level %logger{36} - %msg%n"

# -- Actuator & Health Checks ------------------------------------
management:
  health:
    mail:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
    prometheus:
      enabled: true
