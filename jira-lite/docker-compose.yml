version: '3.8'

services:
  # ── PostgreSQL ──────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: jiralite-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jiralite
      POSTGRES_USER: jiralite
      POSTGRES_PASSWORD: jiralite
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jiralite"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ──────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: jiralite-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Jira-Lite Application ─────────────────────────────────
  # Uncomment to run the app in Docker:
  # app:
  #   build: .
  #   container_name: jiralite-app
  #   restart: unless-stopped
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DB_USERNAME: jiralite
  #     DB_PASSWORD: jiralite
  #     REDIS_HOST: redis
  #     SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/jiralite
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #     redis:
  #       condition: service_healthy

volumes:
  postgres_data:
  redis_data:

